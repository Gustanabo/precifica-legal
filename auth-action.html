<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Custo Certo / Pricify</title>
  <style>
    :root {
      --bg: #faf7f5;
      --card: #ffffff;
      --text: #1f1a17;
      --muted: #6b5e55;
      --border: #e7ded8;
      --primary: #c85a32;
      --primary-hover: #af4b27;
      --primary-soft: #fbeee8;
      --success: #1f7a4c;
      --success-soft: #e8f6ee;
      --error: #b42318;
      --error-soft: #fef3f2;
      --shadow: 0 16px 40px rgba(31, 26, 23, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161311;
        --card: #221d1a;
        --text: #f6f1ee;
        --muted: #b5a69c;
        --border: #38302b;
        --primary: #e0724a;
        --primary-hover: #eb835d;
        --primary-soft: #36231c;
        --success: #4cc38a;
        --success-soft: #193226;
        --error: #f97066;
        --error-soft: #371b19;
        --shadow: 0 18px 44px rgba(0, 0, 0, 0.42);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.5;
    }

    .shell {
      width: 100%;
      max-width: 440px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding: 0 4px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.125rem;
      letter-spacing: -0.01em;
    }

    .brand-badge {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1rem;
      box-shadow: 0 4px 12px rgba(200, 90, 50, 0.28);
    }

    .lang-switch {
      display: inline-flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px;
      gap: 2px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .lang-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 26px;
      box-shadow: var(--shadow);
    }

    .icon-circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .icon-circle.success {
      background: var(--success-soft);
      color: var(--success);
    }

    .icon-circle.error {
      background: var(--error-soft);
      color: var(--error);
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: -0.015em;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    .email-pill {
      display: block;
      text-align: center;
      font-size: 0.875rem;
      font-weight: 600;
      background: var(--primary-soft);
      color: var(--primary);
      padding: 8px 14px;
      border-radius: 10px;
      margin-bottom: 20px;
      word-break: break-all;
    }

    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 12px 44px 12px 14px;
      font-size: 1rem;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input:focus {
      border-color: var(--primary);
    }

    .toggle-pw {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 6px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .alert {
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.875rem;
      margin-bottom: 16px;
      background: var(--error-soft);
      color: var(--error);
      display: none;
    }

    .alert.visible {
      display: block;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      padding: 13px 18px;
      cursor: pointer;
      transition: background 0.15s ease, opacity 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .btn:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .app-hint {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .footer a {
      color: var(--muted);
      text-decoration: underline;
      margin: 0 6px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-badge" id="brandBadge">C</span>
        <span id="brandName">Custo Certo</span>
      </div>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" class="lang-btn" id="btnPt">PT</button>
        <button type="button" class="lang-btn" id="btnEn">EN</button>
      </div>
    </header>

    <section class="card">
      <!-- Loading State -->
      <div id="stateLoading">
        <div class="icon-circle">
          <div class="spinner" aria-hidden="true"></div>
        </div>
        <h1 id="loadingTitle">Processando sua solicitação...</h1>
        <p class="subtitle" id="loadingSubtitle">Aguarde apenas um instante.</p>
      </div>

      <!-- Reset Password Form State -->
      <div id="stateResetForm" class="hidden">
        <div class="icon-circle" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h1 id="resetTitle">Criar nova senha</h1>
        <p class="subtitle" id="resetSubtitle">Escolha uma nova senha segura para acessar sua conta.</p>
        <span class="email-pill hidden" id="resetEmailPill"></span>

        <div class="alert" id="formError" role="alert"></div>

        <form id="resetForm" novalidate>
          <div class="field">
            <label for="newPassword" id="labelNewPw">Nova senha</label>
            <div class="input-wrap">
              <input type="password" id="newPassword" autocomplete="new-password" minlength="6" required />
              <button type="button" class="toggle-pw" id="togglePw1"></button>
            </div>
          </div>

          <div class="field">
            <label for="confirmPassword" id="labelConfirmPw">Confirmar nova senha</label>
            <div class="input-wrap">
              <input type="password" id="confirmPassword" autocomplete="new-password" minlength="6" required />
              <button type="button" class="toggle-pw" id="togglePw2"></button>
            </div>
          </div>

          <button type="submit" class="btn" id="submitResetBtn">Salvar nova senha</button>
        </form>
      </div>

      <!-- Success State -->
      <div id="stateSuccess" class="hidden">
        <div class="icon-circle success" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <h1 id="successTitle">E-mail confirmado!</h1>
        <p class="subtitle" id="successSubtitle"></p>
        <span class="email-pill hidden" id="successEmailPill"></span>
        <a id="continueBtn" class="btn hidden" href="#" rel="noopener noreferrer"></a>
        <div class="app-hint" id="returnAppHint"></div>
      </div>

      <!-- Error State -->
      <div id="stateError" class="hidden">
        <div class="icon-circle error" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
        <h1 id="errorTitle">Link inválido ou expirado</h1>
        <p class="subtitle" id="errorSubtitle"></p>
        <div class="app-hint" id="errorAppHint"></div>
      </div>
    </section>

    <footer class="footer">
      <span>Gunabu</span> ·
      <a href="./privacy-policy" id="footerPrivacy">Política de Privacidade</a> ·
      <a href="./terms-of-use" id="footerTerms">Termos de Uso</a>
    </footer>
  </main>

  <script>
    (function () {
      const COPY = {
        pt: {
          brand: "Custo Certo",
          badge: "C",
          pageTitle: "Custo Certo — Conta",
          loadingTitle: "Processando sua solicitação...",
          loadingSubtitle: "Aguarde apenas um instante.",
          resetTitle: "Criar nova senha",
          resetSubtitle: "Escolha uma nova senha segura para acessar sua conta.",
          labelNewPw: "Nova senha (mínimo 6 caracteres)",
          labelConfirmPw: "Confirmar nova senha",
          showPw: "Mostrar",
          hidePw: "Ocultar",
          submitReset: "Salvar nova senha",
          savingReset: "Salvando...",
          pwTooShort: "A nova senha deve ter pelo menos 6 caracteres.",
          pwMismatch: "As senhas digitadas não coincidem.",
          verifySuccessTitle: "E-mail confirmado com sucesso!",
          verifySuccessSubtitle: "Sua conta no Custo Certo já está verificada.",
          resetSuccessTitle: "Senha redefinida com sucesso!",
          resetSuccessSubtitle: "Sua nova senha já está ativa.",
          recoverSuccessTitle: "E-mail restaurado com sucesso!",
          recoverSuccessSubtitle: "O endereço de e-mail anterior da sua conta foi recuperado.",
          continueBtn: "Continuar",
          returnAppHint: "Você já pode fechar esta aba, voltar ao aplicativo Custo Certo no seu celular e tocar em \"Já verifiquei\" ou fazer login.",
          returnAppHintReset: "Você já pode fechar esta aba, abrir o aplicativo Custo Certo no seu celular e entrar com sua nova senha.",
          errorTitle: "Não foi possível concluir",
          errorMissingParams: "Este link está incompleto ou foi aberto fora de um e-mail de verificação válido.",
          errorExpired: "Este link expirou ou já foi utilizado anteriormente.",
          errorDisabled: "Esta conta foi desativada.",
          errorWeakPw: "A senha escolhida é muito fraca. Escolha uma senha mais forte.",
          errorGeneric: "Ocorreu um erro ao validar o link. Verifique sua conexão e tente novamente.",
          errorAppHint: "Abra o aplicativo Custo Certo no seu celular para solicitar um novo e-mail.",
          footerPrivacy: "Política de Privacidade",
          footerTerms: "Termos de Uso"
        },
        en: {
          brand: "Pricify",
          badge: "P",
          pageTitle: "Pricify — Account",
          loadingTitle: "Processing your request...",
          loadingSubtitle: "Please wait just a moment.",
          resetTitle: "Create new password",
          resetSubtitle: "Choose a secure new password to access your account.",
          labelNewPw: "New password (at least 6 characters)",
          labelConfirmPw: "Confirm new password",
          showPw: "Show",
          hidePw: "Hide",
          submitReset: "Save new password",
          savingReset: "Saving...",
          pwTooShort: "Your new password must be at least 6 characters long.",
          pwMismatch: "The passwords you entered do not match.",
          verifySuccessTitle: "Email verified!",
          verifySuccessSubtitle: "Your Pricify account email has been confirmed.",
          resetSuccessTitle: "Password updated!",
          resetSuccessSubtitle: "Your new password is now active.",
          recoverSuccessTitle: "Email restored!",
          recoverSuccessSubtitle: "Your previous account email address has been restored.",
          continueBtn: "Continue",
          returnAppHint: "You can now close this tab, return to the Pricify app on your phone, and tap \"I've verified\" or sign in.",
          returnAppHintReset: "You can now close this tab, open the Pricify app on your phone, and sign in with your new password.",
          errorTitle: "Unable to complete request",
          errorMissingParams: "This link is incomplete or was opened outside of a valid verification email.",
          errorExpired: "This link has expired or has already been used.",
          errorDisabled: "This user account has been disabled.",
          errorWeakPw: "The password is too weak. Please choose a stronger password.",
          errorGeneric: "Something went wrong while validating your link. Please check your connection and try again.",
          errorAppHint: "Open the Pricify app on your phone to request a new email link.",
          footerPrivacy: "Privacy Policy",
          footerTerms: "Terms of Use"
        }
      };

      const params = new URLSearchParams(window.location.search);
      const mode = params.get("mode") || "";
      const oobCode = params.get("oobCode") || "";
      const apiKey = params.get("apiKey") || "";
      const continueUrl = params.get("continueUrl") || "";
      const rawLang = (params.get("lang") || navigator.language || "en").toLowerCase();

      let currentLang = rawLang.startsWith("pt") ? "pt" : "en";
      let activeView = "loading"; // loading | resetForm | success | error
      let successKind = "verify"; // verify | reset | recover
      let errorKind = "generic";  // missing | expired | disabled | generic
      let accountEmail = "";

      const el = (id) => document.getElementById(id);

      function isSafeHttpUrl(url) {
        if (!url) return false;
        try {
          const parsed = new URL(url);
          return parsed.protocol === "https:" || parsed.protocol === "http:";
        } catch (_) {
          return false;
        }
      }

      function mapFirebaseErrorKind(code) {
        const msg = String(code || "").toUpperCase();
        if (msg.includes("EXPIRED_OOB_CODE") || msg.includes("INVALID_OOB_CODE")) {
          return "expired";
        }
        if (msg.includes("USER_DISABLED")) {
          return "disabled";
        }
        if (msg.includes("WEAK_PASSWORD")) {
          return "weak";
        }
        return "generic";
      }

      function getErrorMessage(t, kind) {
        switch (kind) {
          case "missing": return t.errorMissingParams;
          case "expired": return t.errorExpired;
          case "disabled": return t.errorDisabled;
          case "weak": return t.errorWeakPw;
          default: return t.errorGeneric;
        }
      }

      function showView(view) {
        activeView = view;
        el("stateLoading").classList.toggle("hidden", view !== "loading");
        el("stateResetForm").classList.toggle("hidden", view !== "resetForm");
        el("stateSuccess").classList.toggle("hidden", view !== "success");
        el("stateError").classList.toggle("hidden", view !== "error");
        renderCopy();
      }

      function renderCopy() {
        const t = COPY[currentLang];
        document.documentElement.lang = currentLang === "pt" ? "pt-BR" : "en";
        document.title = t.pageTitle;

        el("brandBadge").textContent = t.badge;
        el("brandName").textContent = t.brand;
        el("btnPt").classList.toggle("active", currentLang === "pt");
        el("btnEn").classList.toggle("active", currentLang === "en");

        el("loadingTitle").textContent = t.loadingTitle;
        el("loadingSubtitle").textContent = t.loadingSubtitle;

        el("resetTitle").textContent = t.resetTitle;
        el("resetSubtitle").textContent = t.resetSubtitle;
        el("labelNewPw").textContent = t.labelNewPw;
        el("labelConfirmPw").textContent = t.labelConfirmPw;
        el("togglePw1").textContent = el("newPassword").type === "password" ? t.showPw : t.hidePw;
        el("togglePw2").textContent = el("confirmPassword").type === "password" ? t.showPw : t.hidePw;
        if (!el("submitResetBtn").disabled) {
          el("submitResetBtn").textContent = t.submitReset;
        }

        const resetEmailPill = el("resetEmailPill");
        if (accountEmail) {
          resetEmailPill.textContent = accountEmail;
          resetEmailPill.classList.remove("hidden");
        } else {
          resetEmailPill.classList.add("hidden");
        }

        if (successKind === "reset") {
          el("successTitle").textContent = t.resetSuccessTitle;
          el("successSubtitle").textContent = t.resetSuccessSubtitle;
          el("returnAppHint").textContent = t.returnAppHintReset;
        } else if (successKind === "recover") {
          el("successTitle").textContent = t.recoverSuccessTitle;
          el("successSubtitle").textContent = t.recoverSuccessSubtitle;
          el("returnAppHint").textContent = t.returnAppHint;
        } else {
          el("successTitle").textContent = t.verifySuccessTitle;
          el("successSubtitle").textContent = t.verifySuccessSubtitle;
          el("returnAppHint").textContent = t.returnAppHint;
        }

        const successEmailPill = el("successEmailPill");
        if (accountEmail) {
          successEmailPill.textContent = accountEmail;
          successEmailPill.classList.remove("hidden");
        } else {
          successEmailPill.classList.add("hidden");
        }

        const continueBtn = el("continueBtn");
        if (isSafeHttpUrl(continueUrl)) {
          continueBtn.href = continueUrl;
          continueBtn.textContent = t.continueBtn;
          continueBtn.classList.remove("hidden");
        } else {
          continueBtn.classList.add("hidden");
        }

        el("errorTitle").textContent = t.errorTitle;
        el("errorSubtitle").textContent = getErrorMessage(t, errorKind);
        el("errorAppHint").textContent = t.errorAppHint;

        el("footerPrivacy").textContent = t.footerPrivacy;
        el("footerTerms").textContent = t.footerTerms;
      }

      async function callIdentityToolkit(endpoint, payload) {
        const url = "https://identitytoolkit.googleapis.com/v1/" + endpoint + "?key=" + encodeURIComponent(apiKey);
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const message = (data && data.error && data.error.message) || "UNKNOWN_ERROR";
          const err = new Error(message);
          err.code = message;
          throw err;
        }
        return data;
      }

      async function initAction() {
        renderCopy();

        if (!mode || !oobCode || !apiKey) {
          errorKind = "missing";
          showView("error");
          return;
        }

        try {
          if (mode === "verifyEmail" || mode === "verifyAndChangeEmail") {
            const data = await callIdentityToolkit("accounts:update", { oobCode });
            accountEmail = data.email || "";
            successKind = "verify";
            showView("success");
            return;
          }

          if (mode === "recoverEmail") {
            const data = await callIdentityToolkit("accounts:update", { oobCode });
            accountEmail = data.email || "";
            successKind = "recover";
            showView("success");
            return;
          }

          if (mode === "resetPassword") {
            const data = await callIdentityToolkit("accounts:resetPassword", { oobCode });
            accountEmail = data.email || "";
            showView("resetForm");
            el("newPassword").focus();
            return;
          }

          errorKind = "missing";
          showView("error");
        } catch (err) {
          errorKind = mapFirebaseErrorKind(err.code || err.message);
          showView("error");
        }
      }

      function setupToggle(btnId, inputId) {
        el(btnId).addEventListener("click", function () {
          const input = el(inputId);
          input.type = input.type === "password" ? "text" : "password";
          renderCopy();
        });
      }

      function setFormError(msg) {
        const box = el("formError");
        if (msg) {
          box.textContent = msg;
          box.classList.add("visible");
        } else {
          box.textContent = "";
          box.classList.remove("visible");
        }
      }

      el("btnPt").addEventListener("click", function () {
        currentLang = "pt";
        setFormError("");
        renderCopy();
      });

      el("btnEn").addEventListener("click", function () {
        currentLang = "en";
        setFormError("");
        renderCopy();
      });

      setupToggle("togglePw1", "newPassword");
      setupToggle("togglePw2", "confirmPassword");

      el("resetForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        const t = COPY[currentLang];
        setFormError("");

        const pw1 = el("newPassword").value;
        const pw2 = el("confirmPassword").value;

        if (!pw1 || pw1.length < 6) {
          setFormError(t.pwTooShort);
          el("newPassword").focus();
          return;
        }
        if (pw1 !== pw2) {
          setFormError(t.pwMismatch);
          el("confirmPassword").focus();
          return;
        }

        const btn = el("submitResetBtn");
        btn.disabled = true;
        btn.textContent = t.savingReset;

        try {
          const data = await callIdentityToolkit("accounts:resetPassword", {
            oobCode: oobCode,
            newPassword: pw1
          });
          accountEmail = data.email || accountEmail;
          successKind = "reset";
          showView("success");
        } catch (err) {
          const kind = mapFirebaseErrorKind(err.code || err.message);
          if (kind === "expired" || kind === "disabled") {
            errorKind = kind;
            showView("error");
          } else {
            setFormError(getErrorMessage(t, kind));
          }
        } finally {
          btn.disabled = false;
          renderCopy();
        }
      });

      initAction();
    })();
  </script>
</body>
</html>
